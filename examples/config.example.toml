# Example Pairflow configuration.
#
# Save this as ~/.config/pairflow/config.toml, or anywhere and point
# pairflow at it with --config / $PAIRFLOW_CONFIG.

[node_red]
# Path to the active flows file. Required.
flows_file  = "/home/pi/.node-red/flows.json"

# Node-RED Admin API base URL. Used for read-only operations and (later)
# triggering inject nodes and reading debug streams.
admin_url   = "http://localhost:1880"

# systemd unit name. Used (later) for restart-on-deploy.
service     = "nodered"

# Optional: path to the git-managed project directory containing flows.json.
# Enables (later) git diff / status / commit tools.
# project_dir = "/home/pi/.node-red/projects/my-project"

# Optional: Node-RED user directory (where settings.js and .config*.json live).
# Defaults to ~/.node-red. Used by the nr_*_credentials tools to read the
# credentialSecret transiently (it is never copied into pairflow config).
# user_dir = "/home/pi/.node-red"

# Optional: explicit path to the encrypted credential-store file. When unset,
# pairflow derives it the way Node-RED does: user_dir + the flows file's
# basename with a "_cred" suffix — e.g. flows_file
# ".../projects/foo/flows_foo.json" → "<user_dir>/flows_foo_cred.json"
# (NOT next to the flows file). Set this explicitly only if Node-RED projects
# mode is active, where the cred file lives inside the active project dir.
# credentials_file = "/home/pi/.node-red/flows_cred.json"

# Optional: arm the editor's "flows changed in the background" warning early.
# When true (default), the first flow-mutating write since the last nr_deploy
# fires one Admin-API `reload`. Node-RED re-reads flows.json, its revision
# advances past what any open editor holds, and both the warning and the 409
# version-mismatch guard arm immediately — so an open editor can't silently
# overwrite in-progress disk edits if the session ends before nr_deploy.
# Note: the reload makes the current (possibly partial) on-disk flow live.
# Set false to keep the old behaviour (warning only after nr_deploy / restart).
# eager_reload = true


# MQTT brokers. The broker named "default" is used when an MQTT tool
# is called without an explicit broker= argument. Add as many additional
# brokers as you need; tool calls reference them by their table name.
[mqtt.default]
host = "localhost"
port = 1883

# Example of a remote broker with credentials:
# [mqtt.remote]
# host         = "broker.example.tld"
# port         = 1883
# username     = "pairflow"
# password_env = "PAIRFLOW_REMOTE_BROKER_PW"   # name of the env var, not the password


# Optional: empirical per-call usage log. Disabled by default. When enabled,
# every MCP tool call appends one JSON line to usage_log_path describing the
# tool, arguments (large blobs scrubbed to size + head), response size, and
# any truncation flags that fired. Lets you see which tools dominate the
# token budget on real workloads. See src/pairflow/usage_log.py for fields.
#
# [telemetry]
# usage_log      = true
# usage_log_path = "/home/pi/.local/state/pairflow/usage.jsonl"   # optional; defaults to $XDG_STATE_HOME/pairflow/usage.jsonl
