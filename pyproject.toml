[project]
name = "pairflow"
version = "0.0.1"
description = "An MCP server for AI-assisted Node-RED engineering."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Pairflow contributors" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    # Planned — not yet installed:
    # "fastmcp>=0.1",
    # "httpx>=0.27",
    # "aiomqtt>=2.0",
    # "websockets>=12",
]

[project.optional-dependencies]
dev = [
    # "pytest>=8",
    # "pytest-asyncio>=0.23",
    # "ruff>=0.5",
]

[project.scripts]
pairflow = "pairflow.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pairflow"]
